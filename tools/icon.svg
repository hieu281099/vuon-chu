<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Hello Làng app icon: chibi villager with a sprout, saying "Hi!" on a sunny sky -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE45C"/><stop offset=".55" stop-color="#FFB13D"/><stop offset="1" stop-color="#FF7A45"/></linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#62E58F"/><stop offset="1" stop-color="#1FAF6A"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A3478"/><stop offset="1" stop-color="#2E2050"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7DF0A6"/><stop offset="1" stop-color="#22C06E"/></linearGradient>
    <clipPath id="card"><rect width="512" height="512" rx="{R}"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <g fill="#FFFFFF" opacity=".22">
      <path d="M256 300L120 -20H200Z"/><path d="M256 300L320 -20H400Z"/><path d="M256 300L-40 120V40Z"/><path d="M256 300L552 40V120Z"/><path d="M256 300L-40 330V260Z"/><path d="M256 300L552 260V330Z"/>
    </g>
    <ellipse cx="120" cy="560" rx="260" ry="150" fill="#3FCF7E"/>
    <ellipse cx="420" cy="570" rx="250" ry="150" fill="url(#hill)"/>
    <!-- body -->
    <path d="M168 512Q170 430 256 422Q342 430 344 512Z" fill="#7C5CFF"/>
    <path d="M226 424L256 452L286 424Z" fill="#FFFFFF"/>
    <!-- sprout -->
    <path d="M256 150Q252 112 262 86" stroke="#22C06E" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M260 96Q214 46 168 72Q196 124 260 104Z" fill="url(#leaf)"/>
    <path d="M262 92Q300 34 356 52Q338 112 264 102Z" fill="url(#leaf)"/>
    <path d="M178 76Q220 76 252 100M346 58Q308 66 270 96" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" opacity=".55"/>
    <!-- head -->
    <circle cx="256" cy="292" r="138" fill="#FFD7B5"/>
    <path d="M118 290Q112 150 256 146Q400 150 394 290Q372 228 318 214Q300 246 256 240Q212 246 194 214Q140 228 118 290Z" fill="url(#hair)"/>
    <path d="M168 196Q206 166 250 164" stroke="#FFFFFF" stroke-width="9" fill="none" stroke-linecap="round" opacity=".25"/>
    <!-- face -->
    <ellipse cx="204" cy="300" rx="21" ry="28" fill="#2B1F3F"/>
    <ellipse cx="308" cy="300" rx="21" ry="28" fill="#2B1F3F"/>
    <circle cx="196" cy="288" r="9" fill="#FFFFFF"/><circle cx="300" cy="288" r="9" fill="#FFFFFF"/>
    <circle cx="211" cy="312" r="4" fill="#FFFFFF"/><circle cx="315" cy="312" r="4" fill="#FFFFFF"/>
    <ellipse cx="166" cy="346" rx="26" ry="15" fill="#FF8FA8" opacity=".75"/>
    <ellipse cx="346" cy="346" rx="26" ry="15" fill="#FF8FA8" opacity=".75"/>
    <path d="M222 348Q256 396 290 348Z" fill="#8A2B3E"/>
    <path d="M238 368Q256 384 274 368Q264 360 256 362Q248 360 238 368Z" fill="#FF6F8A"/>
    <!-- speech bubble -->
    <g transform="rotate(8 392 128)">
      <rect x="318" y="76" width="160" height="104" rx="40" fill="#FFFFFF"/>
      <path d="M352 168L330 214L382 174Z" fill="#FFFFFF"/>
      <text x="398" y="150" text-anchor="middle" font-family="Arial Black, Segoe UI Black, Arial, sans-serif" font-weight="900" font-size="68" fill="#7C5CFF">Hi!</text>
    </g>
  </g>
</svg>
